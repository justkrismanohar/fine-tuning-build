# Pull the published image (OLMo on :8000, Jupyter on :8888):
#   docker compose up
# Then http://localhost:8888/lab  and in T1-01 set BACKEND = "local"
#
# Image: https://hub.docker.com/r/unclekris/fine-tuning-course-t1
# Give Docker Desktop about 8 GB RAM.
services:
  lab:
    image: unclekris/fine-tuning-course-t1:v1
    pull_policy: missing
    ports:
      - "8888:8888"
      - "8000:8000"
    working_dir: /civicdesk
    environment:
      CIVICDESK_LOAD_MODELS: ${CIVICDESK_LOAD_MODELS:-olmo}
    # volumes:
    #   - .:/civicdesk
    # gpus: all
