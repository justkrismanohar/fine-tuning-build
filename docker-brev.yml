version: '1.0'

services:
  backend:
    image: unclekris/finetuning-course:v1
    pull_policy: always
    ulimits:
      memlock: -1
      stack: 67108864
    shm_size: 1g
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ports:
      - "0.0.0.0:8888:8888"      # JupyterLab
      - "0.0.0.0:8000:8000"      # Dask dashboard
      - "0.0.0.0:8001:8001"      # Dask scheduler
    user: root
    working_dir: /civicdesk
    environment:
        CIVICDESK_LOAD_MODELS: ${CIVICDESK_LOAD_MODELS:-olmo}
    restart: unless-stopped